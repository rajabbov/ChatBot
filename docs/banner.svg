<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="ChatBot">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#161B2E"/>
  </linearGradient>
  <radialGradient id="glow" cx="78%" cy="45%" r="55%">
    <stop offset="0" stop-color="#818CF8" stop-opacity=".28"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#818CF8"/><stop offset="1" stop-color="#F472B6"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".05"/>
  </pattern>
  <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect x="64" y="62" width="44" height="5" rx="2.5" fill="url(#acc)"/>
  <text x="120" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#818CF8">ANDROID · GEMINI</text>
  <text x="62" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#F5F6FA" letter-spacing="-1">ChatBot</text>
  <text x="64" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#B7BCD0">AIBrain — a chatbot that remembers</text><text x="64" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#B7BCD0">the conversation, written in Java.</text>
