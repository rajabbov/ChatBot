  <g><rect x="800" y="40" width="400" height="320" rx="22" fill="#1E2438" stroke="#2C3450" stroke-width="2"/><rect x="800" y="40" width="400" height="48" rx="22" fill="#252C44"/><rect x="800" y="66" width="400" height="22" fill="#252C44"/><circle cx="830" cy="64" r="12" fill="url(#acc)"/><text x="852" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#F5F6FA" text-anchor="start" >AIBrain · Gemini</text><g opacity="0"><rect x="1041" y="108" width="139" height="40" rx="16" fill="#818CF8"/><text x="1055.8" y="134" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0D1117" text-anchor="start" >Salom, Brain!</text><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;.95;1" dur="7s" repeatCount="indefinite"/></g><g opacity="0"><rect x="820" y="160" width="215" height="40" rx="16" fill="#2E3656"/><text x="835" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F6FA" text-anchor="start" >Salom! How can I help?</text><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.27;.95;1" dur="7s" repeatCount="indefinite"/></g><g opacity="0"><rect x="932" y="212" width="248" height="40" rx="16" fill="#818CF8"/><text x="946.6" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0D1117" text-anchor="start" >Remember my last question?</text><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.52;.95;1" dur="7s" repeatCount="indefinite"/></g><g transform="translate(830,284)" opacity="0"><circle cx="0" cy="0" r="5" fill="#F472B6"><animate attributeName="cy" values="0;-6;0" dur=".9s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="16" cy="0" r="5" fill="#F472B6"><animate attributeName="cy" values="0;-6;0" dur=".9s" begin="0.15s" repeatCount="indefinite"/></circle><circle cx="32" cy="0" r="5" fill="#F472B6"><animate attributeName="cy" values="0;-6;0" dur=".9s" begin="0.3s" repeatCount="indefinite"/></circle><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.75;.95;1" dur="7s" repeatCount="indefinite"/></g><rect x="816" y="318" width="320" height="30" rx="15" fill="#11162A"/><text x="832" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#8B92AB" text-anchor="start" >Type a message…</text><circle cx="1166" cy="333" r="15" fill="#818CF8"/><path d="M1160 326 l12 7 -12 7z" fill="#0D1117"/></g>
</g>
